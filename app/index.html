<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: file:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Viral Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fixed left rail (sections) + wide content column; vertical 9:16 video tiles are the main unit. Single dark look, deliberate. */
:root{
  --bg:#0b0b10; --panel:#14141c; --panel2:#1c1c27; --line:#2a2a38;
  --fg:#f2f2f7; --muted:#9a9ab0; --dim:#6b6b80;
  --accent:#ff2d6f; --accent2:#25e2f0;
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5a;
  --yt:#ff3b30; --tt:#25e2f0; --ig:#d94bd9; --fb:#4f8cff;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:12px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.titlebar{height:40px;display:flex;align-items:center;gap:10px;padding:0 150px 0 16px;border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;font-size:12px;color:var(--muted)}
.titlebar .brand{padding:0;font-size:14px}
.titlebar .tb-sp{flex:1}
.titlebar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.app{display:grid;grid-template-columns:220px 1fr;height:calc(100% - 41px)}
.rail{height:100%;overflow:auto;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;padding:0 10px 18px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:22px;border-radius:3px;background:linear-gradient(180deg,var(--accent2),var(--accent));display:inline-block}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--panel);color:var(--fg)}
.nav[aria-current="page"]{background:var(--panel2);color:var(--fg)}
.nav[aria-current="page"] .cnt{background:var(--accent);color:#fff}
.cnt{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.rail-foot{margin-top:auto;padding:12px;border-radius:10px;background:var(--panel);font-size:12px;color:var(--muted)}
.rail-foot b{display:block;font-family:var(--mono);font-size:18px;color:var(--fg);font-weight:500}
main{overflow:auto;height:100%;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;}
main>*{max-width:1400px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:var(--display);font-size:30px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.example{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 8px;border-radius:6px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat div{font-family:var(--mono);font-size:18px}

/* concept block */
.concept{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px;margin-bottom:18px}
.c-top{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:start}
.c-src{width:88px;aspect-ratio:9/16;border-radius:8px;background:var(--panel2) center/cover;position:relative;overflow:hidden}
.c-src span{position:absolute;left:4px;bottom:4px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:4px}
.c-meta{min-width:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);font-weight:600}
.c-meta h3{font-family:var(--display);font-size:19px;margin:2px 0 6px}
.c-meta p{margin:0;color:var(--muted);max-width:70ch}
.hook{margin-top:8px!important;color:var(--fg)!important}
.hook b{color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.vid{display:flex;flex-direction:column;gap:8px;min-width:0}
.player{aspect-ratio:9/16;max-width:100%;border-radius:10px;position:relative;overflow:hidden;background:var(--panel2) center/cover;border:1px solid var(--line)}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.65))}
.play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:1}
.play::before{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.p-info{position:absolute;left:10px;right:10px;bottom:8px;z-index:1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
.status{position:absolute;top:8px;left:8px;z-index:1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.6)}
.status.gen{color:var(--warn)} .status.fix{color:var(--accent2)} .status.ok{color:var(--ok)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{padding:8px 10px;border-radius:8px;font-weight:600;font-size:13px;background:var(--panel2);border:1px solid var(--line);text-align:center}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.cy{color:var(--accent2)}
.btn.del{color:var(--bad)}
.fixbox{display:flex;flex-direction:column;gap:6px}
textarea{width:100%;min-height:72px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px}
.row{display:flex;gap:6px}
.row .btn{flex:1}
.note{font-size:12px;color:var(--muted)}
.confirm{font-size:12px;color:var(--bad);text-align:center}

/* review */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rcard h4{margin:0;font-family:var(--display);font-size:15px}
.rcard .note{margin-top:-6px}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:20px;color:var(--muted);font-size:13px}
.flow b{color:var(--fg);font-weight:600}
.flow .arr{color:var(--dim)}

/* schedule */
.weekbar{display:flex;align-items:center;gap:8px}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}
.day{border-right:1px solid var(--line);min-height:460px;display:flex;flex-direction:column}
.day:last-child{border-right:0}
.day-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-family:var(--display)}
.day-h span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.day.today .day-h{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.day-b{padding:8px;display:flex;flex-direction:column;gap:8px}
.post{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;display:flex;gap:8px;width:100%}
.post:hover{border-color:var(--dim)}
.post .th{width:34px;aspect-ratio:9/16;border-radius:5px;background:var(--bg) center/cover;flex:none}
.post .pi{min-width:0;display:flex;flex-direction:column;gap:4px}
.post time{font-family:var(--mono);font-size:12px}
.post .cap{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plats{display:flex;gap:3px;flex-wrap:wrap}
.pl{font-family:var(--mono);font-size:10px;font-weight:500;padding:0 5px;border-radius:4px;border:1px solid currentColor}
.pl.yt{color:var(--yt)} .pl.tt{color:var(--tt)} .pl.ig{color:var(--ig)} .pl.fb{color:var(--fb)}
.post.posted{opacity:.6}
.post.failed{border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.detail{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:120px 1fr;gap:16px}
.detail .player{width:120px}
.detail h4{margin:0 0 4px;font-family:var(--display)}
.detail p{margin:6px 0;max-width:70ch}

/* viral */
.vlist{display:flex;flex-direction:column;gap:14px}
.vrow{display:grid;grid-template-columns:120px 1fr 230px;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;align-items:start}
.vrow .player{width:120px}
.vrow h3{font-family:var(--display);font-size:17px;margin:2px 0 4px}
.why{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:13px}
.why dt{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.why dd{margin:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.num{background:var(--panel2);border-radius:8px;padding:6px 8px}
.num small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num b{font-family:var(--mono);font-weight:500;font-size:15px}
.side{display:flex;flex-direction:column;gap:8px}
.src{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent2)}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;transition:opacity .2s}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);z-index:5}
  .brand,.rail-foot{display:none}
  .nav{width:auto;gap:8px;white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .c-top{grid-template-columns:70px 1fr}
  .c-top>.btn{grid-column:1/-1}
  .c-src{width:70px}
  .vrow{grid-template-columns:90px 1fr}
  .vrow .player{width:90px}
  .vrow .side{grid-column:1/-1}
  .detail{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="titlebar"><div class="brand"><i></i>Viral Studio</div><span class="tb-sp"></span><span class="dot"></span><span>Prototype · example data</span></header>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <button class="nav" data-view="today">Today <span class="cnt" id="c-today"></span></button>
    <button class="nav" data-view="review">Review <span class="cnt" id="c-review"></span></button>
    <button class="nav" data-view="schedule">Schedule posts <span class="cnt" id="c-schedule"></span></button>
    <button class="nav" data-view="viral">Viral <span class="cnt" id="c-viral"></span></button>
    <div class="rail-foot">Higgsfield credits today<b id="credits">0</b>Budget 600 / day<br><button class="btn" id="reset" style="margin-top:10px;width:100%">Reset example data</button></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const IMG={v1:"img/v1.jpg",v2:"img/v2.jpg",v3:"img/v3.jpg",v4:"img/v4.jpg"};
const grad=(a,b)=>`linear-gradient(160deg,${a},${b})`;
const S={
  viral:[
    {id:"vr1",img:IMG.v2,plat:"Instagram",handle:"@cabin.family.fun",views:"8.4M",likes:"612K",comments:"9.1K",posted:"2 days ago",product:"Projector hunting game",niche:"Toys · Christmas gifts",hook:"Dad snatches the kids' screens, then reveals the box",format:"Family gift reaction, 6 shots, 15s",emotion:"Surprise → excitement → dad/son bonding",added:false},
    {id:"vr2",img:IMG.v1,plat:"TikTok",handle:"@rpm.gallery",views:"12.1M",likes:"1.3M",comments:"22K",posted:"4 days ago",product:"FPV RC car + VR headset",niche:"Gadgets · Gifts for dads",hook:"\"What they see…\" vs the in-car POV",format:"POV wow factor, impossible camera angles",emotion:"Curiosity, nostalgia, 'I need this'",added:true},
    {id:"vr3",img:"",bg:grad("#3a1550","#0d2a4a"),plat:"TikTok",handle:"@glowroomco",views:"5.2M",likes:"480K",comments:"6.3K",posted:"1 day ago",product:"Galaxy star projector",niche:"Home decor · Bedroom",hook:"Girlfriend turns off the light, room becomes a galaxy",format:"Partner reaction, 4 shots, 12s",emotion:"Wonder, cozy, romantic",added:false},
    {id:"vr4",img:"",bg:grad("#4a2a10","#1a1a1a"),plat:"Instagram",handle:"@relaxlabs",views:"3.9M",likes:"201K",comments:"4.8K",posted:"3 days ago",product:"Mini massage gun",niche:"Health · Gifts for parents",hook:"Grandpa tries it for the first time",format:"First-try reaction, 5 shots, 15s",emotion:"Funny, wholesome",added:false}
  ],
  concepts:[
    {id:"c1",from:"vr2",img:IMG.v1,views:"12.1M",tag:"POV wow factor",title:"Living-room Grand Prix",product:"FPV RC car + VR headset",hook:"\"My dad hasn't moved from the couch in 3 hours\"",desc:"Dad and teenage son race two RC cars through the house wearing VR headsets. Cut between their reactions and the in-car POV under tables and past the dog.",len:"15s",vids:[
      {id:"g1",bg:IMG.v4,dur:"0:15",cr:72,st:"ready"},
      {id:"g2",bg:IMG.v1,dur:"0:15",cr:72,st:"ready"}]},
    {id:"c2",from:"vr1",img:IMG.v2,views:"8.4M",tag:"Gift reaction",title:"Screens off, game on",product:"Projector hunting game",hook:"\"The perfect Christmas gift doesn't exi—\"",desc:"Mom films as dad takes the kids' tablets away, reveals the box, sets up the projector and the whole family plays on the living-room wall.",len:"15s",vids:[
      {id:"g3",bg:IMG.v3,dur:"0:15",cr:72,st:"ready"},
      {id:"g4",bg:"",bgc:grad("#2b1d12","#121218"),dur:"0:15",cr:72,st:"generating"}]}
  ],
  review:[
    {id:"r1",bg:IMG.v4,title:"Living-room Grand Prix · take 3",product:"FPV RC car + VR headset",dur:"0:15",st:"pending"},
    {id:"r2",bg:IMG.v3,title:"Screens off, game on · take 1",product:"Projector hunting game",dur:"0:15",st:"pending"},
    {id:"r3",bg:"",bgc:grad("#3a1550","#0d2a4a"),title:"Bedroom galaxy · take 2",product:"Galaxy star projector",dur:"0:12",st:"drive"}
  ],
  posts:[
    {d:0,t:"09:30",img:IMG.v1,pl:["tt","ig","yt","fb"],cap:"POV: you gave dad the best gift of his life 🏎️",st:"posted"},
    {d:0,t:"18:00",img:IMG.v3,pl:["tt","ig"],cap:"The perfect Christmas gift doesn't exi—",st:"scheduled"},
    {d:1,t:"12:00",img:"",bg:grad("#3a1550","#0d2a4a"),pl:["tt","ig","fb"],cap:"She had no idea what was coming ✨",st:"scheduled"},
    {d:2,t:"09:30",img:IMG.v4,pl:["yt","tt"],cap:"What they see vs what it looks like",st:"scheduled"},
    {d:3,t:"19:00",img:IMG.v2,pl:["ig","fb"],cap:"Took their tablets. Zero regrets.",st:"failed"},
    {d:4,t:"10:00",img:"",bg:grad("#4a2a10","#1a1a1a"),pl:["tt","ig","yt","fb"],cap:"Grandpa's first time 😂",st:"scheduled"},
    {d:6,t:"17:30",img:IMG.v1,pl:["tt"],cap:"3 hours later he still won't give it back",st:"scheduled"}
  ],
  ui:{fixOpen:null,delAsk:null,postSel:null,vfilter:"All"}
};
try{const saved=JSON.parse(localStorage.getItem('vs-state')||'null');if(saved&&saved.v===1){Object.assign(S,saved.s);S.ui={fixOpen:null,delAsk:null,postSel:null,vfilter:'All'}}}catch(e){}
const PL={yt:"YT",tt:"TT",ig:"IG",fb:"FB"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bgOf=o=>o.bg&&o.bg.startsWith("img/")?`background-image:url('${o.bg}')`:o.img?`background-image:url('${o.img}')`:`background:${o.bgc||o.bg||"var(--panel2)"}`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}

function counts(){
  $("#c-today").textContent=S.concepts.reduce((n,c)=>n+c.vids.length,0);
  $("#c-review").textContent=S.review.filter(r=>r.st==="pending").length;
  $("#c-schedule").textContent=S.posts.filter(p=>p.st!=="posted").length;
  $("#c-viral").textContent=S.viral.length;
  $("#credits").textContent=S.concepts.reduce((n,c)=>n+c.vids.reduce((m,v)=>m+v.cr,0),0);
}

function vTile(v,c){
  const st=v.st==="generating"?'<span class="status gen">Generating…</span>':v.st==="fixing"?'<span class="status fix">Regenerating with fix…</span>':v.st==="upscaling"?'<span class="status ok">Sent to upscale</span>':"";
  let act;
  if(S.ui.fixOpen===v.id){
    act=`<div class="fixbox"><label class="note" for="fx-${v.id}">What's wrong with this video?</label><textarea id="fx-${v.id}" placeholder="e.g. the car looks plastic in shot 3, dad's lips don't match the words"></textarea><div class="row"><button class="btn" data-a="fixcancel">Cancel</button><button class="btn pri" data-a="fixsend" data-v="${v.id}" data-c="${c.id}">Regenerate</button></div></div>`;
  }else if(S.ui.delAsk===v.id){
    act=`<div class="confirm">Delete this video?</div><div class="row"><button class="btn" data-a="delno">Keep</button><button class="btn del" data-a="delyes" data-v="${v.id}" data-c="${c.id}">Delete</button></div>`;
  }else if(v.st==="ready"){
    act=`<div class="actions"><button class="btn cy" data-a="fix" data-v="${v.id}">Fix</button><button class="btn pri" data-a="up" data-v="${v.id}" data-c="${c.id}">Upscale</button><button class="btn del" data-a="del" data-v="${v.id}">Delete</button></div>`;
  }else act=`<div class="note">${v.st==="generating"?"Seedance 2.5 · 480p · about 3 min left":"You'll see the new take here when it's done"}</div>`;
  return `<div class="vid"><div class="player" style="${bgOf(v)}">${st}${v.st==="ready"?'<span class="play" aria-hidden="true"></span>':""}<div class="p-info"><span>${v.dur} · 480p</span><span>${v.cr} cr</span></div></div>${act}</div>`;
}

const V={
today(){
  const d=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const total=S.concepts.reduce((n,c)=>n+c.vids.length,0);
  return `<div class="head"><div><h1>Today</h1><p class="sub">${d} · ${S.concepts.length} concepts from today's viral finds · ${total} videos generated</p></div><span class="example">Example data</span></div>
  ${S.concepts.length?S.concepts.map(c=>`<section class="concept">
    <div class="c-top">
      <div class="c-src" style="background-image:url('${c.img}')" title="Source viral video"><span>${c.views}</span></div>
      <div class="c-meta"><div class="eyebrow">${esc(c.tag)} · ${esc(c.product)}</div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><p class="hook"><b>Hook</b> ${esc(c.hook)}</p>
      <div class="tags"><span class="tag">Seedance 2.5</span><span class="tag">${c.len}</span><span class="tag">9:16</span><span class="tag">Sound + lip-sync</span><span class="tag">No start frame</span></div></div>
      <button class="btn" data-a="more" data-c="${c.id}">+ 1 more take</button>
    </div>
    <div class="vids">${c.vids.map(v=>vTile(v,c)).join("")||'<p class="note">All takes handled.</p>'}</div>
  </section>`).join(""):'<div class="empty">No concepts yet today. Turn a video from Viral into a concept to start.</div>'}`;
},
review(){
  return `<div class="head"><div><h1>Review</h1><p class="sub">Upscaled videos waiting for your OK</p></div><span class="example">Example data</span></div>
  <div class="flow"><b>Approve</b><span class="arr">→</span>saved to Google Drive / Viral Studio / To edit<span class="arr">→</span>you edit in CapCut<span class="arr">→</span>drop it in <b>/Ready to post</b><span class="arr">→</span>it appears in Schedule posts</div>
  <div class="rgrid">${S.review.map(r=>`<div class="rcard"><div class="player" style="${bgOf(r)}">${r.st==="drive"?'<span class="status ok">In Google Drive</span>':""}<span class="play" aria-hidden="true"></span><div class="p-info"><span>${r.dur} · upscaled</span></div></div>
    <h4>${esc(r.title)}</h4><div class="note">${esc(r.product)}</div>
    ${r.st==="pending"?`<div class="row"><button class="btn del" data-a="rrej" data-r="${r.id}">Reject</button><button class="btn pri" data-a="rok" data-r="${r.id}">Approve → Drive</button></div>`:`<div class="note">Waiting for your edited version in /Ready to post</div>`}
  </div>`).join("")}</div>`;
},
schedule(){
  const now=new Date(),start=new Date(now);start.setDate(now.getDate());
  const days=[...Array(7)].map((_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x});
  const sel=S.ui.postSel!=null?S.posts[S.ui.postSel]:null;
  return `<div class="head"><div><h1>Schedule posts</h1><p class="sub">Next 7 days · YouTube Shorts, TikTok, Instagram Reels, Facebook Reels</p></div><span class="example">Example data</span></div>
  <div class="cal-wrap"><div class="cal">${days.map((x,i)=>`<div class="day ${i===0?"today":""}"><div class="day-h"><b>${x.toLocaleDateString("en-GB",{weekday:"short"})}</b><span>${x.getDate()} ${x.toLocaleDateString("en-GB",{month:"short"})}</span></div><div class="day-b">
    ${S.posts.map((p,k)=>({p,k})).filter(o=>o.p.d===i).sort((a,b)=>a.p.t.localeCompare(b.p.t)).map(({p,k})=>`<button class="post ${p.st}" data-a="psel" data-k="${k}"><span class="th" style="${p.img?`background-image:url('${p.img}')`:`background:${p.bg}`}"></span><span class="pi"><time>${p.t}${p.st==="posted"?" · posted":p.st==="failed"?" · failed":""}</time><span class="plats">${p.pl.map(x=>`<span class="pl ${x}">${PL[x]}</span>`).join("")}</span><span class="cap">${esc(p.cap)}</span></span></button>`).join("")}
  </div></div>`).join("")}</div></div>
  <div class="legend"><span><span class="pl yt">YT</span> YouTube Shorts</span><span><span class="pl tt">TT</span> TikTok</span><span><span class="pl ig">IG</span> Instagram Reels</span><span><span class="pl fb">FB</span> Facebook Reels</span><span>Faded = already posted · red border = failed</span></div>
  ${sel?`<div class="detail"><div class="player" style="${sel.img?`background-image:url('${sel.img}')`:`background:${sel.bg}`}"><span class="play" aria-hidden="true"></span></div><div><h4>${days[sel.d].toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})} at ${sel.t}</h4><div class="plats">${sel.pl.map(x=>`<span class="pl ${x}">${PL[x]}</span>`).join("")}</div><p>${esc(sel.cap)}</p><p class="note">#giftideas #christmasgift #tiktokmademebuyit · captions are written per platform</p>${sel.st==="failed"?'<p style="color:var(--bad)">Instagram rejected the upload: video is shorter than 3 seconds after editing. Replace the file in /Ready to post.</p>':""}${sel.st!=="posted"?`<div class="row" style="max-width:360px"><button class="btn" data-a="pnow" data-k="${S.ui.postSel}">Post now</button><button class="btn del" data-a="pdel" data-k="${S.ui.postSel}">Unschedule</button></div>`:""}</div></div>`:'<p class="note" style="margin-top:14px">Select a post to see its caption and details.</p>'}`;
},
viral(){
  const f=S.ui.vfilter;
  const list=S.viral.filter(v=>f==="All"||v.plat===f);
  return `<div class="head"><div><h1>Viral</h1><p class="sub">Found today by your IG product finder · ranked by views</p></div><span class="example">Example data</span></div>
  <div class="filters" style="margin-bottom:16px">${["All","TikTok","Instagram"].map(x=>`<button class="chip" aria-pressed="${x===f}" data-a="vf" data-f="${x}">${x}</button>`).join("")}</div>
  <div class="vlist">${list.map(v=>`<article class="vrow"><div class="player" style="${v.img?`background-image:url('${v.img}')`:`background:${v.bg}`}"><span class="play" aria-hidden="true"></span></div>
    <div style="min-width:0"><div class="eyebrow">${esc(v.niche)}</div><h3>${esc(v.product)}</h3><div class="src">${v.plat} · ${esc(v.handle)} · ${v.posted}</div>
      <dl class="why"><dt>Hook</dt><dd>${esc(v.hook)}</dd><dt>Format</dt><dd>${esc(v.format)}</dd><dt>Emotion</dt><dd>${esc(v.emotion)}</dd></dl></div>
    <div class="side"><div class="nums"><div class="num"><small>Views</small><b>${v.views}</b></div><div class="num"><small>Likes</small><b>${v.likes}</b></div><div class="num"><small>Comm.</small><b>${v.comments}</b></div></div>
      ${v.added?'<button class="btn" disabled style="opacity:.6">Concept in Today ✓</button>':`<button class="btn pri" data-a="mk" data-id="${v.id}">Make concept</button>`}</div>
  </article>`).join("")}</div>`;
}};

function route(){const h=(location.hash||"#today").slice(1);return V[h]?h:"today"}
function render(){
  const v=route();
  document.querySelectorAll(".nav").forEach(b=>b.setAttribute("aria-current",b.dataset.view===v?"page":"false"));
  $("#main").innerHTML=V[v]();counts();
  try{localStorage.setItem('vs-state',JSON.stringify({v:1,s:{viral:S.viral,concepts:S.concepts.map(c=>({...c,vids:c.vids.map(x=>x.st==='generating'||x.st==='fixing'?{...x,st:'ready',bg:x.bg||c.img}:x)})),review:S.review,posts:S.posts}}))}catch(e){}
}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{location.hash=b.dataset.view});
addEventListener("hashchange",render);

$("#main").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,findC=id=>S.concepts.find(c=>c.id===id);
  if(a==="fix"){S.ui.fixOpen=b.dataset.v;S.ui.delAsk=null}
  if(a==="fixcancel")S.ui.fixOpen=null;
  if(a==="fixsend"){const c=findC(b.dataset.c),v=c.vids.find(x=>x.id===b.dataset.v);v.st="fixing";S.ui.fixOpen=null;toast("Regenerating with your fix");setTimeout(()=>{v.st="ready";render()},3500)}
  if(a==="del"){S.ui.delAsk=b.dataset.v;S.ui.fixOpen=null}
  if(a==="delno")S.ui.delAsk=null;
  if(a==="delyes"){const c=findC(b.dataset.c);c.vids=c.vids.filter(x=>x.id!==b.dataset.v);S.ui.delAsk=null;toast("Deleted")}
  if(a==="up"){const c=findC(b.dataset.c),v=c.vids.find(x=>x.id===b.dataset.v);c.vids=c.vids.filter(x=>x!==v);S.review.unshift({id:"r"+Date.now(),bg:v.bg,bgc:v.bgc,title:c.title+" · new take",product:c.product,dur:v.dur,st:"pending"});toast("Upscaling. It will show up in Review.")}
  if(a==="more"){const c=findC(b.dataset.c);const v={id:"g"+Date.now(),bg:"",bgc:grad("#1d1d2b","#121218"),dur:"0:15",cr:72,st:"generating"};c.vids.push(v);toast("New take started · 72 credits");setTimeout(()=>{v.st="ready";v.bg=c.img;render()},4000)}
  if(a==="rok"){S.review.find(r=>r.id===b.dataset.r).st="drive";toast("Saved to Google Drive / To edit")}
  if(a==="rrej"){S.review=S.review.filter(r=>r.id!==b.dataset.r);toast("Rejected")}
  if(a==="psel")S.ui.postSel=+b.dataset.k;
  if(a==="pnow"){S.posts[+b.dataset.k].st="posted";toast("Posted")}
  if(a==="pdel"){S.posts.splice(+b.dataset.k,1);S.ui.postSel=null;toast("Unscheduled")}
  if(a==="vf")S.ui.vfilter=b.dataset.f;
  if(a==="mk"){const v=S.viral.find(x=>x.id===b.dataset.id);v.added=true;S.concepts.unshift({id:"c"+Date.now(),from:v.id,img:v.img||IMG.v4,views:v.views,tag:v.format.split(",")[0],title:"New: "+v.product,product:v.product,hook:v.hook,desc:"Rebuilt from scratch with your product. Claude writes the full prompt and generates the first takes.",len:"15s",vids:[{id:"g"+Date.now(),bg:"",bgc:grad("#1d1d2b","#121218"),dur:"0:15",cr:72,st:"generating"}]});toast("Concept added to Today")}
  render();
});
document.getElementById('reset').onclick=()=>{try{localStorage.removeItem('vs-state')}catch(e){}location.reload()};
render();
</script>
</body>
</html>
