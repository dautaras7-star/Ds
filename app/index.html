<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https: file:; media-src 'self' blob: file: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Viral Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: desktop shell = title bar + left rail of pipeline steps + scrolling content. 9:16 tiles are the main unit. Single dark look. */
:root{
  --bg:#0b0b10; --panel:#14141c; --panel2:#1c1c27; --line:#2a2a38;
  --fg:#f2f2f7; --muted:#9a9ab0; --dim:#6b6b80;
  --accent:#ff2d6f; --accent2:#25e2f0;
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5a;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}

.titlebar{height:40px;display:flex;align-items:center;gap:10px;padding:0 150px 0 16px;border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;font-size:12px;color:var(--muted)}
.brand{font-family:var(--display);font-weight:700;font-size:14px;color:var(--fg);display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.sp{flex:1}
.app{display:grid;grid-template-columns:230px 1fr;height:calc(100% - 41px)}
.rail{height:100%;overflow:auto;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--fg)}
.nav[aria-current="page"]{background:var(--panel2);color:var(--fg)}
.nav .n{font-family:var(--mono);font-size:10px;color:var(--dim);width:14px}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;padding:0 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.nav[aria-current="page"] .cnt{background:var(--accent);color:#fff}
.nav .soon{margin-left:auto;font-size:10px;color:var(--dim)}
.rail-foot{margin-top:auto;padding:12px;border-radius:10px;background:var(--panel);font-size:12px;color:var(--muted)}
.rail-foot b{display:block;font-family:var(--mono);font-size:18px;color:var(--fg);font-weight:500}
main{overflow:auto;height:100%;padding:26px 30px 60px;min-width:0}
main>*{max-width:1400px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:28px}
.sub{color:var(--muted);margin:4px 0 0;max-width:75ch}
.example{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 8px;border-radius:6px}
.btn{padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;background:var(--panel2);border:1px solid var(--line);text-align:center;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.cy{color:var(--accent2)}
.btn.bad{color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn.big{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.fill>.btn{flex:1}
.note{font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.chip{padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,var(--panel))}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.cy{color:var(--accent2)} .pill.pk{color:var(--accent)}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

.player{aspect-ratio:9/16;max-width:100%;border-radius:10px;position:relative;overflow:hidden;background:var(--panel2) center/cover;border:1px solid var(--line)}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.65))}
.play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:1}
.play::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.p-info{position:absolute;left:8px;right:8px;bottom:6px;z-index:1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
.status{position:absolute;top:8px;left:8px;z-index:1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.65)}
.status.gen{color:var(--warn)} .status.fix{color:var(--accent2)} .status.ok{color:var(--ok)}
.status.r{left:auto;right:8px}

/* products (viral finds) */
.scrollbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.scrolling{display:flex;align-items:center;gap:10px;color:var(--accent2);font-weight:600}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent2);border-top-color:transparent;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vrow{display:grid;grid-template-columns:110px 1fr 220px;gap:18px;align-items:start;margin-bottom:12px}
.vrow .player{width:110px}
.vrow h3{font-size:17px;margin:2px 0 4px}
.why{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:8px;font-size:13px}
.why dt{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.why dd{margin:0}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.num{background:var(--panel2);border-radius:8px;padding:6px 8px}
.num small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num b{font-family:var(--mono);font-weight:500;font-size:14px}
.num.hl b{color:var(--accent)}

/* my products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:12px}
.pcard:hover{border-color:var(--dim)}
.plogo{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:#fff;flex:none}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--panel2)}
.steps span.on{background:var(--accent2)}
.back{color:var(--muted);font-size:13px;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--fg)}
.detail{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.step{margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-h .k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--panel2);color:var(--muted)}
.step-h .k.done{background:var(--ok);color:#000}
.step-h h3{font-size:16px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.asset{display:flex;flex-direction:column;gap:6px}
.art{border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;display:grid;place-items:center}
.art.sq{aspect-ratio:1}
.art.wide{aspect-ratio:820/312}
.art .mono{font-family:var(--display);font-weight:700;color:#fff}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#fff;padding:3px;width:100%;height:100%}
.collage div{background:#f1f1f4;display:grid;place-items:center;color:#9a9ab0;font-size:10px}
.box3d{width:58%;height:58%;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:13px;box-shadow:10px 10px 0 rgba(0,0,0,.25)}
.wide-asset{grid-column:1/-1}
.side{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

/* concepts */
.cstep{margin-bottom:20px}
.cstep h2{font-size:17px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.cstep h2 .k{font-family:var(--mono);font-size:12px;color:var(--dim)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lcard{display:grid;grid-template-columns:62px 1fr;gap:12px;text-align:left;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.lcard[aria-pressed="true"]{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--panel))}
.lcard .player{width:62px;border-radius:7px}
.lcard h4{font-size:14px;margin-bottom:2px}
.lcard p{margin:0;font-size:12px;color:var(--muted)}
.lcard .fits{margin-top:6px;font-size:11px;color:var(--dim)}
.combos{display:flex;flex-direction:column;gap:8px}
.combo{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.combo b{font-family:var(--display)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent2);color:#000;font-weight:600}
.genbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* generations / finals */
.ggroup{margin-bottom:22px}
.ggroup-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ggroup-h .plogo{width:34px;height:34px;border-radius:9px;font-size:14px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.vid{display:flex;flex-direction:column;gap:8px;min-width:0}
.vid .lab{font-size:12px;line-height:1.35}
.vid .lab b{display:block;font-family:var(--display);font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.confirm{font-size:12px;color:var(--bad);text-align:center}

/* library */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.addform{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.addform .full{grid-column:1/-1}

.crit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:12px;align-items:end;margin-bottom:18px}
.crit input,.crit select{font-family:var(--mono)}
.checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ck{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--ok)}
.demand{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:13px}
.demand .lvl{font-weight:700}
.demand .lvl.High{color:var(--ok)} .demand .lvl.Medium{color:var(--warn)} .demand .lvl.Low{color:var(--bad)}
.demand q{display:block;color:var(--muted);font-size:12px;margin-top:3px}
a.player{display:block;color:inherit}
a.title-link{color:inherit;text-decoration:none}
a.title-link:hover{text-decoration:underline}
.ext{font-size:11px;color:var(--accent2);position:absolute;top:8px;right:8px;z-index:1;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:5px}
.lcard{position:relative}
.lcard .tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lcard .tools .btn{padding:3px 9px;font-size:11px;cursor:pointer}
.lcard .tools input[type=file]{display:none}
.lcard video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.lcard .sel{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:transparent}
.lcard[aria-pressed="true"] .sel{background:var(--accent2);border-color:var(--accent2)}
.rename{display:flex;gap:6px;margin-bottom:4px}
.rename input{padding:4px 8px}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.player video ~ .play{display:none}
body.live .example{display:none}
.modetag{font-weight:600}
body.live .modetag{color:var(--ok)}
#jobs{display:flex;flex-direction:column;gap:6px;margin-top:auto;margin-bottom:10px}
#jobs:empty{display:none}
.jobrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.jobrow b{display:block;font-size:12px}
.jobrow span{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow button{font-size:11px;color:var(--bad);margin-top:4px}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.conn .panel h3{font-size:16px;margin-bottom:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--dim)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
code.cmd{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12px;margin:6px 0;user-select:all;overflow-x:auto}
.form{display:flex;flex-direction:column;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
ol.steps-list{margin:6px 0 0;padding-left:18px;color:var(--muted)}
ol.steps-list li{margin:4px 0}
.soonbox{max-width:620px}
.soonbox ul{color:var(--muted);padding-left:18px}

.toast{position:fixed;right:20px;bottom:20px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
@media (max-width:1150px){.detail{grid-template-columns:1fr}.side{position:static}.vrow{grid-template-columns:90px 1fr}.vrow .player{width:90px}.vrow .act{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="titlebar"><div class="brand"><i></i>Viral Studio</div><span class="sp"></span><span class="modetag" id="modelabel">Example data</span></header>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="grp">Find</div>
    <button class="nav" data-view="products"><span class="n">1</span>Products<span class="cnt" id="c-products"></span></button>
    <button class="nav" data-view="my"><span class="n">2</span>My products<span class="cnt" id="c-my"></span></button>
    <div class="grp">Create</div>
    <button class="nav" data-view="concepts"><span class="n">3</span>Concepts</button>
    <button class="nav" data-view="generations"><span class="n">4</span>Generations<span class="cnt" id="c-gen"></span></button>
    <button class="nav" data-view="finals"><span class="n">5</span>Finals<span class="cnt" id="c-fin"></span></button>
    <div class="grp">Library &amp; posting</div>
    <button class="nav" data-view="library"><span class="n"></span>Finished clips</button>
    <button class="nav" data-view="schedule"><span class="n"></span>Schedule<span class="soon">later</span></button>
    <button class="nav" data-view="connection"><span class="n"></span><span class="dot" id="ccdot"></span>Connection</button>
    <div id="jobs"></div>
    <div class="rail-foot">Higgsfield credits today<b id="credits">0</b><button class="btn" id="reset" style="margin-top:10px;width:100%">Reset example data</button></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

    {id:"p3",from:"Galaxy star projector",img:"",bg:G("#3a1550","#0d2a4a"),variation:"",niche:"",nameOpts:[],name:"",color:"#6c3fd1",kit:{logo:"todo",cover:"todo",collage:"todo",box:"todo"},supplier:"AliExpress · $9.80",handles:""}
  ],

      ${ping?`<div class="demand" style="margin-top:10px">${ping.running?'<span class="scrolling"><span class="spin"></span>Asking Claude Code which tools it has…</span>':ping.ok?`<div><span class="dot ${ping.higgsfield?"ok":"bad"}"></span>Higgsfield ${ping.higgsfield?"connected":"not found"}</div><div><span class="dot ${ping.chrome?"ok":"bad"}"></span>Claude in Chrome ${ping.chrome?"connected":"not found"}</div><div><span class="dot ${ping.drive?"ok":"bad"}"></span>Google Drive ${ping.drive?"connected":"not found"}</div>`:`<span style="color:var(--bad)">${esc(ping.error||"Test failed")}</span>`}</div>`:""}
    </section>
    <section class="panel"><h3>Settings</h3>
      <form class="form" id="setform">
        <div class="two"><label class="f">Claude Code command<input type="text" id="st-cmd" value="${esc(s.claudeCommand||"claude")}"></label>
        <label class="f">Permission mode<select id="st-perm">${["auto","acceptEdits","dontAsk","bypassPermissions"].map(m=>`<option ${m===s.permissionMode?"selected":""}>${m}</option>`).join("")}</select></label></div>
        <label class="f">Always-allowed tools (space separated)<input type="text" id="st-tools" value="${esc(s.allowedTools||"")}"></label>
        <div class="two"><label class="f">Max credits per video<input type="text" inputmode="numeric" id="st-max" value="${esc(s.maxCreditsPerVideo||150)}"></label>
        <label class="check" style="margin-top:18px"><input type="checkbox" id="st-chrome" ${s.useChrome!==false?"checked":""}>Use Claude in Chrome for scrolling</label></div>
        <div class="row"><button class="btn pri" type="submit" ${inApp?"":"disabled"}>Save settings</button><button class="btn" type="button" data-a="openws" ${inApp?"":"disabled"}>Open work folder</button></div>
        <p class="note">Work folder: ${esc(WS||"—")}</p>
      </form>
    </section>
    <section class="panel"><h3>One-time setup</h3>
      <ol class="steps-list">
        <li><b>Higgsfield in Claude Code:</b> open PowerShell, run <code class="cmd">claude</code>, then type <code class="cmd">/mcp</code> and check Higgsfield is listed. If not, tell Claude in this chat and I'll give you the exact command.</li>
        <li><b>Claude in Chrome:</b> install the Claude in Chrome extension in the Chrome where your burner Instagram is logged in, and sign in with the same Claude account.</li>
        <li><b>Google Drive:</b> coming next.</li>
        <li>Press <b>Test connection</b>.</li>
      </ol>
    </section>
  </div>`;
},
schedule(){
  return `<div class="head"><div><h1>Schedule</h1><p class="sub">Coming later.</p></div></div>
  <div class="panel soonbox"><h3 style="margin-bottom:8px">Planned</h3><ul><li>Pick up edited videos from Google Drive /Ready to post</li><li>Week calendar for YouTube Shorts, TikTok, Instagram Reels and Facebook Reels</li><li>Caption and hashtags written for each platform</li><li>Post to each product's own brand accounts</li></ul></div>`;
}};

const CLIPS={};
const ig=f=>"https://www.instagram.com/"+encodeURIComponent(f.handle)+"/";
function libCard(x,kind,mode){
  const c=S.concept,sel=mode==="pick"&&(kind==="hook"?c.hooks:c.reveals).includes(x.id);
  const media=CLIPS[x.id]?`<video src="${CLIPS[x.id]}" muted loop autoplay playsinline></video>`:"";
  const name=S.ui.editing===x.id?`<div class="rename"><input type="text" id="rn-input" value="${esc(x.name)}" aria-label="New name"><button class="btn pri" data-a="rnsave" data-id="${x.id}">Save</button></div>`:`<h4>${esc(x.name)}</h4>`;
  return `<div class="lcard" ${mode==="pick"?`aria-pressed="${sel}"`:""} style="grid-template-columns:70px 1fr">
    <div class="player" style="${bg(x)};width:70px">${media}</div>
    <div style="min-width:0">${name}<p>${esc(x.desc)}</p><div class="fits">Fits: ${esc(x.fits)}</div>${x.clipName?`<div class="fits">Clip: ${esc(x.clipName)}</div>`:""}
      <div class="tools">${mode==="pick"?`<button class="btn ${sel?"cy":""}" data-a="pick${kind}" data-id="${x.id}">${sel?"Selected ✓":"Select"}</button>`:""}<button class="btn" data-a="rn" data-id="${x.id}">Rename</button><label class="btn">Upload clip<input type="file" accept="video/*" data-up="${x.id}"></label>${mode==="lib"?`<button class="btn bad" data-a="libdel" data-id="${x.id}">Delete</button>`:""}</div>
    </div></div>`;
}
function jobsUI(){
  const el=$("#jobs");if(!el)return;
  el.innerHTML=Object.entries(JOBS).map(([id,j])=>`<div class="jobrow"><b>${esc(j.label)}</b><span>${esc(j.progress)}</span><button data-cancel="${id}">Stop</button></div>`).join("");
}
document.addEventListener("click",e=>{const c=e.target.closest("[data-cancel]");if(c&&window.studio)window.studio.cancelJob(c.dataset.cancel)});
function runJob(type,label,input,onDone){
  const id=type+"-"+Date.now().toString(36)+"-"+uid();
  JOBS[id]={type,label,progress:"Starting…",onDone};
  window.studio.startJob({id,type,input}).catch(err=>{delete JOBS[id];onDone({ok:false,error:String(err)});render()});
  jobsUI();return id;
}
if(window.studio)window.studio.onJobEvent(m=>{
  const j=JOBS[m.id];if(!j)return;
  if(m.kind==="progress"){j.progress=m.text;jobsUI();return}
  delete JOBS[m.id];
  const r=m.result||{ok:false,error:"No result"};
  try{j.onDone(r)}catch(err){console.error(err)}
  if(!r.ok)toast(r.error||"Job failed");
  render();
});
function askNames(p){runJob("names","Name ideas · "+p.from,{product:p.from,variation:p.variation,niche:p.niche},r=>{if(r.ok)p.nameOpts=r.names||[]})}
function refsOf(pr){return [pr.art&&pr.art.collage,pr.art&&pr.art.box].filter(Boolean).map(x=>/^https?:/.test(x)?x:x)}
const LIVE={
  scroll(){S.ui.scrolling=true;runJob("scroll","Scrolling Instagram",{criteria:S.criteria,count:5},r=>{S.ui.scrolling=false;if(r.ok){(r.finds||[]).forEach(f=>S.finds.unshift({id:uid(),...f,img:f.thumb?media(f.thumb):"",bg:G("#1d1d2b","#0b0b10"),quotes:f.quotes||[]}));toast(`Found ${(r.finds||[]).length} product(s)`)}})},
  stopscroll(){Object.keys(JOBS).filter(k=>JOBS[k].type==="scroll").forEach(k=>window.studio.cancelJob(k));S.ui.scrolling=false},
  morenames(){askNames(P(S.ui.prod))},
  kitgen(b){const p=P(S.ui.prod),k=b.dataset.k;p.kit[k]="gen";runJob("brandkit",`${k} · ${p.name}`,{asset:k,name:p.name,product:p.from,variation:p.variation,color:p.color,refs:k==="collage"?[]:refsOf(p)},r=>{if(r.ok){p.art=p.art||{};p.art[k]=r.file;p.kit[k]="pending";S.credits+=r.credits||0}else p.kit[k]=p.art&&p.art[k]?"pending":"todo"})},
  generate(){
    const c=S.concept,pr=P(c.pid),hk=i=>S.hooks.find(x=>x.id===i),rv=i=>S.reveals.find(x=>x.id===i);let n=0;
    c.hooks.forEach(h=>c.reveals.forEach(rId=>{
      const H=hk(h),R=rv(rId),engine=c.engines[h+"|"+rId]||"Seedance";
      const g={id:uid(),pid:c.pid,hook:H.name,reveal:R.name,engine,dur:"…",cr:0,bg:"",bgc:G("#1d1d2b","#121218"),st:"generating"};
      S.gens.unshift(g);n++;
      g.jobId=runJob("generate",`${H.name} + ${R.name}`,{product:{name:pr.name,from:pr.from,refs:refsOf(pr)},hook:{name:H.name,desc:H.desc},reveal:{name:R.name,desc:R.desc},engine,source:pr.url||"",maxCredits:(SETTINGS&&+SETTINGS.maxCreditsPerVideo)||150},r=>{
        if(r.ok){Object.assign(g,{st:"ready",video:r.video,job_id:r.job_id,prompt:r.prompt||"",dur:r.duration||"0:15",cr:r.credits||0});S.credits+=r.credits||0}else S.gens=S.gens.filter(x=>x!==g)});
    }));
    S.concept={pid:c.pid,hooks:[],reveals:[],engines:{}};toast(`Generating ${n} video${n>1?"s":""}`);location.hash="generations";
  },
  fixsend(b,id){const g=S.gens.find(x=>x.id===id);const note=$("#fx").value.trim();if(!note){toast("Write what should change");return}const pr=P(g.pid);g.fix=note;g.st="fixing";S.ui.fixOpen=null;
    g.jobId=runJob("fix",`Fix · ${g.hook}`,{product:{name:pr.name,from:pr.from,refs:refsOf(pr)},hook:{name:g.hook},reveal:{name:g.reveal},engine:g.engine,source:pr.url||"",note,previous_prompt:g.prompt||"",maxCredits:(SETTINGS&&+SETTINGS.maxCreditsPerVideo)||150},r=>{
      if(r.ok){Object.assign(g,{st:"ready",video:r.video,job_id:r.job_id,prompt:r.prompt||g.prompt,dur:r.duration||g.dur,cr:r.credits||g.cr});S.credits+=r.credits||0}else g.st="ready"})},
  approve(b,id){const g=S.gens.find(x=>x.id===id);if(!g.job_id){toast("This clip has no Higgsfield job to upscale");return}g.st="upscaling";
    runJob("upscale",`Upscale · ${g.hook}`,{job_id:g.job_id},r=>{if(r.ok){g.st="final";g.video=r.video;g.up_job=r.job_id;g.drive=false}else g.st="ready"})},
  drive(b,id){const g=S.gens.find(x=>x.id===id),pr=P(g.pid);runJob("drive",`Drive · ${g.hook}`,{video:g.video,product:pr?pr.name:"",name:`${g.hook} + ${g.reveal}`},r=>{if(r.ok){g.drive=true;g.drive_url=r.drive_url}})},
  driveall(){S.gens.filter(g=>g.st==="final"&&!g.drive).forEach(g=>LIVE.drive(null,g.id))}
};
const CONN={
  mode(b){const m=b.dataset.v;if(m===MODE)return;save();MODE=m;try{localStorage.setItem("vs-mode",m)}catch(e){}S=load();toast(m==="live"?"Live mode: buttons now run Claude Code":"Showing example data")},
  async cccheck(){CC={checked:false};render();CC={checked:true,...await window.studio.checkClaude()};render()},
  ping(){S.ui.ping={running:true};runJob("ping","Connection test",{},r=>{S.ui.ping=r})},
  openws(){window.studio.openWorkspace()},
  goconn(){location.hash="connection"}
};
document.addEventListener("submit",async e=>{if(e.target.id!=="setform")return;e.preventDefault();
  SETTINGS=await window.studio.setSettings({claudeCommand:$("#st-cmd").value.trim()||"claude",permissionMode:$("#st-perm").value,allowedTools:$("#st-tools").value.trim(),maxCreditsPerVideo:parseInt($("#st-max").value,10)||150,useChrome:$("#st-chrome").checked});
  toast("Settings saved");render()});
async function boot(){
  if(!window.studio){CC={checked:true,ok:false,version:""};if(MODE==="live"){MODE="example";S=load()}render();return}
  try{SETTINGS=await window.studio.getSettings();WS=SETTINGS.workspace||""}catch(e){}
  render();
  try{CC={checked:true,...await window.studio.checkClaude()}}catch(e){CC={checked:true,ok:false}}
  render();
}
function gTile(g){
  const st=g.st==="generating"?'<span class="status gen">Generating…</span>':g.st==="fixing"?'<span class="status fix">Fixing</span>':g.st==="upscaling"?'<span class="status ok">Upscaling</span>':"";
  let act;
  if(S.ui.fixOpen===g.id)act=`<label class="note" for="fx">What should change?</label><textarea id="fx" placeholder="e.g. box logo blurry in shot 2, dad's lips don't match">${esc(g.fix||"")}</textarea><div class="row fill"><button class="btn" data-a="fixcancel">Cancel</button><button class="btn pri" data-a="fixsend" data-id="${g.id}">Regenerate</button></div>`;
  else if(S.ui.dropAsk===g.id)act=`<div class="confirm">Drop this clip for good?</div><div class="row fill"><button class="btn" data-a="dropno">Keep</button><button class="btn bad" data-a="dropyes" data-id="${g.id}">Drop</button></div>`;
  else if(g.st==="ready")act=`<div class="acts"><button class="btn bad" data-a="drop" data-id="${g.id}">Drop</button><button class="btn cy" data-a="fix" data-id="${g.id}">Fix</button><button class="btn ok" data-a="approve" data-id="${g.id}">Approve</button></div>`;
  else act=`<div class="note">${g.st==="generating"?(g.jobId&&JOBS[g.jobId]?esc(JOBS[g.jobId].progress):"About 3 min left"):g.st==="fixing"?"Fix: "+esc(g.fix||""):"Upscaling with Topaz to 1080p, then moves to Finals"}</div>`;
  return `<div class="vid"><div class="player" style="${bg(g)}">${vmedia(g)}${st}<span class="status r" style="color:var(--muted)">${g.engine}</span>${g.st==="ready"?'<span class="play"></span>':""}<div class="p-info"><span>${g.dur} · 480p</span><span>${g.cr} cr</span></div></div><div class="lab"><b>${esc(g.hook)}</b>+ ${esc(g.reveal)}</div>${act}</div>`;
}

function route(){const h=(location.hash||"#products").slice(1);return V[h]&&h!=="product"?h:"products"}
function render(){
  const v=route();
  document.querySelectorAll(".nav").forEach(b=>b.setAttribute("aria-current",b.dataset.view===v?"page":"false"));
  document.body.classList.toggle("live",MODE==="live");$("#modelabel").textContent=MODE==="live"?"Live · Claude Code":"Example data";
  $("#ccdot").className="dot "+(CC.checked?(CC.ok?"ok":"bad"):"");
  const warn=MODE==="live"&&CC.checked&&!CC.ok&&v!=="connection"?`<div class="panel" style="margin-bottom:16px;border-color:var(--bad)"><b>Claude Code isn't set up on this PC yet</b>, so buttons can't do real work. <button class="btn" data-a="goconn" style="margin-left:8px">Set it up</button></div>`:"";
  $("#main").innerHTML=warn+V[v]();counts();save();jobsUI();
  const f=$("#addform");if(f)f.onsubmit=e=>{e.preventDefault();const n=$("#an").value.trim();if(!n)return;const list=S.ui.libTab==="hooks"?S.hooks:S.reveals;const nx={id:uid(),name:n,desc:$("#ad").value.trim()||"—",fits:$("#af").value.trim()||"Any",bg:G("#232336","#0b0b10")};const cf=$("#aclip").files[0];if(cf){CLIPS[nx.id]=URL.createObjectURL(cf);nx.clipName=cf.name}list.push(nx);S.ui.addOpen=false;toast("Saved to library");render()};
  const vo=$("#varown");if(vo)vo.onkeydown=e=>{if(e.key==="Enter"&&vo.value.trim()){setVar(P(S.ui.prod),vo.value.trim())}};
}
function later(ms,fn){setTimeout(()=>{fn();render()},ms)}
function setVar(p,v){p.variation=v;p.nameOpts=[];p.name="";Object.keys(p.kit).forEach(k=>p.kit[k]="todo");toast("Variation set. Suggesting names…");(MODE==="live"?askNames(p):later(900,()=>{p.nameOpts=suggest(p)}));render()}
function suggest(p){const base=["Nova","Glow","Pulse","Orbit","Loop","Spark","Peak","Haven","Bolt","Echo"],end=["Beam","Lab","Play","Box","Go","Kit","Pro","Mate"];return [...Array(4)].map(()=>base[Math.random()*base.length|0]+end[Math.random()*end.length|0])}

document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{S.ui.prod=null;location.hash=b.dataset.view;render()});
addEventListener("hashchange",render);
$("#reset").onclick=()=>{try{localStorage.removeItem(KEY())}catch(e){}S=load();render()};

$("#main").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,gen=S.gens.find(g=>g.id===id),p=S.ui.prod&&P(S.ui.prod);
  if(CONN[a]){CONN[a](b,id);render();return}
  if(MODE==="live"&&LIVE[a]){if(!window.studio){toast("Live mode only works in the desktop app");return}LIVE[a](b,id);render();return}
  switch(a){
    case"scroll":S.ui.scrolling=true;later(3500,()=>{S.ui.scrolling=false;const c=S.criteria;S.finds.unshift({id:uid(),img:"",bg:G("#103a40","#0b0b10"),handle:"mugmagic.shop",posts:Math.min(c.maxPosts,9),followers:Math.max(c.minFollowers,3100).toLocaleString("en-US"),views:"2.2M",x:Math.max(c.minX,183)+"×",likes:"130K",comments:"1.9K",posted:"today",product:"Self-stirring mug",supplier:"AliExpress · $6.40",hook:"My coworkers think I'm a wizard",reveal:"Press button, whirlpool forms",demand:"High",buyPct:44,quotes:["Where do I get one?","Perfect gift for my dad","Link in bio?"]});toast("Found 1 product that passes your rules")});break;
    case"stopscroll":S.ui.scrolling=false;break;
    case"skip":S.finds=S.finds.filter(f=>f.id!==id);toast("Skipped. I'll find a replacement on the next scroll");break;
    case"pick":{const f=S.finds.find(x=>x.id===id);S.finds=S.finds.filter(x=>x.id!==id);const np={id:uid(),from:f.product,url:f.url||"",img:f.img,bg:f.bg,variation:"",niche:"",nameOpts:[],name:"",color:["#d9480f","#1f9e5a","#6c3fd1","#0f7fd9","#c21f6a"][Math.random()*5|0],kit:{logo:"todo",cover:"todo",collage:"todo",box:"todo"},supplier:f.supplier,handles:""};S.products.unshift(np);toast("Added to My products");break}
    case"open":S.ui.prod=id;location.hash="my";break;
    case"closeprod":S.ui.prod=null;break;
    case"delprod":S.products=S.products.filter(x=>x.id!==id);S.gens=S.gens.filter(g=>g.pid!==id);S.ui.prod=null;toast("Product removed");break;
    case"var":setVar(p,b.dataset.v);return;
    case"morenames":p.nameOpts=suggest(p);break;
    case"name":p.name=b.dataset.v;p.handles="@"+p.name.toLowerCase();Object.keys(p.kit).forEach(k=>p.kit[k]="todo");toast("Name set. Generate the brand kit next");break;
    case"kitgen":{const k=b.dataset.k;p.kit[k]="gen";S.credits+=4;later(1500,()=>{p.kit[k]="pending"});break}
    case"kitok":p.kit[b.dataset.k]="ok";if(kitDone(p)===4)toast("Brand kit done. Ready for concepts");break;
    case"toconcept":S.concept={pid:id,hooks:[],reveals:[],engines:{}};S.ui.prod=null;location.hash="concepts";break;
    case"cprod":S.concept={pid:id,hooks:[],reveals:[],engines:{}};break;
    case"pickhook":{const l=S.concept.hooks;l.includes(id)?l.splice(l.indexOf(id),1):l.push(id);break}
    case"pickrev":{const l=S.concept.reveals;l.includes(id)?l.splice(l.indexOf(id),1):l.push(id);break}
    case"eng":S.concept.engines[b.dataset.k]=b.dataset.v;break;
    case"rmcombo":{const c=S.concept;if(c.hooks.length>1&&c.reveals.length>1){toast("Unselect a hook or reveal to drop this pair")}else if(c.hooks.length===1){c.reveals=c.reveals.filter(x=>x!==b.dataset.r)}else{c.hooks=c.hooks.filter(x=>x!==b.dataset.h)}break}
    case"generate":{const c=S.concept;const hk=i=>S.hooks.find(x=>x.id===i).name,rv=i=>S.reveals.find(x=>x.id===i).name;const pr=P(c.pid);const made=[];c.hooks.forEach(h=>c.reveals.forEach(r=>{const g={id:uid(),pid:c.pid,hook:hk(h),reveal:rv(r),engine:c.engines[h+"|"+r]||"Seedance",dur:"0:15",cr:72,bg:"",bgc:G("#1d1d2b","#121218"),st:"generating"};S.gens.unshift(g);made.push(g);S.credits+=72}));S.concept={pid:c.pid,hooks:[],reveals:[],engines:{}};toast(`Generating ${made.length} video${made.length>1?"s":""}`);later(4000,()=>made.forEach(g=>{g.st="ready";g.bg=pr.img||IMG.v4}));location.hash="generations";break}
    case"fix":S.ui.fixOpen=id;S.ui.dropAsk=null;break;
    case"fixcancel":S.ui.fixOpen=null;break;
    case"fixsend":gen.fix=$("#fx").value.trim();gen.st="fixing";S.ui.fixOpen=null;S.credits+=gen.cr;toast("Regenerating with your fix");later(3500,()=>{gen.st="ready"});break;
    case"drop":S.ui.dropAsk=id;S.ui.fixOpen=null;break;
    case"dropno":S.ui.dropAsk=null;break;
    case"dropyes":S.gens=S.gens.filter(g=>g.id!==id);S.ui.dropAsk=null;toast("Dropped");break;
    case"approve":gen.st="upscaling";toast("Upscaling with Topaz · 1080p");later(2500,()=>{gen.st="final";gen.drive=false});break;
    case"unfinal":gen.st="ready";break;
    case"drive":gen.drive=true;toast("Sent to Google Drive");break;
    case"driveall":S.gens.filter(g=>g.st==="final").forEach(g=>g.drive=true);toast("All sent to Google Drive");break;
    case"rn":S.ui.editing=id;break;
    case"rnsave":{const v=$("#rn-input").value.trim();const x=[...S.hooks,...S.reveals].find(i=>i.id===id);if(v&&x)x.name=v;S.ui.editing=null;toast("Renamed");break}
    case"tab":S.ui.libTab=b.dataset.v;S.ui.addOpen=false;break;
    case"addopen":S.ui.addOpen=true;break;
    case"addclose":S.ui.addOpen=false;break;
    case"libdel":S.hooks=S.hooks.filter(x=>x.id!==id);S.reveals=S.reveals.filter(x=>x.id!==id);break;
  }
  render();
});
$("#main").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.up&&t.files&&t.files[0]){const f=t.files[0],x=[...S.hooks,...S.reveals].find(i=>i.id===t.dataset.up);if(!x)return;if(CLIPS[x.id])URL.revokeObjectURL(CLIPS[x.id]);CLIPS[x.id]=URL.createObjectURL(f);x.clipName=f.name;toast("Clip uploaded");render();return}
  const num=v=>parseInt(String(v).replace(/[^0-9]/g,""),10);
  if(t.id==="cr-posts"&&num(t.value)>0)S.criteria.maxPosts=num(t.value);
  if(t.id==="cr-fol"&&num(t.value)>=0)S.criteria.minFollowers=num(t.value);
  if(t.id==="cr-x"&&num(t.value)>0){S.criteria.minX=num(t.value);t.value=S.criteria.minX+"×"}
  if(t.id==="cr-dem")S.criteria.demand=t.value;
  if(t.id&&t.id.startsWith("cr-"))save();
});
$("#main").addEventListener("keydown",e=>{if(e.target.id==="rn-input"&&e.key==="Enter"){e.preventDefault();document.querySelector('[data-a="rnsave"]').click()}});
boot();
