<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https: file:; media-src 'self' blob: file: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Viral Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: desktop shell = title bar + left rail of pipeline steps + scrolling content. 9:16 tiles are the main unit. Single dark look. */
:root{
  --bg:#0b0b10; --panel:#14141c; --panel2:#1c1c27; --line:#2a2a38;
  --fg:#f2f2f7; --muted:#9a9ab0; --dim:#6b6b80;
  --accent:#ff2d6f; --accent2:#25e2f0;
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5a;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}

.titlebar{height:40px;display:flex;align-items:center;gap:10px;padding:0 150px 0 16px;border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;font-size:12px;color:var(--muted)}
.brand{font-family:var(--display);font-weight:700;font-size:14px;color:var(--fg);display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.sp{flex:1}
.app{display:grid;grid-template-columns:230px 1fr;height:calc(100% - 41px)}
.rail{height:100%;overflow:auto;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--fg)}
.nav[aria-current="page"]{background:var(--panel2);color:var(--fg)}
.nav .n{font-family:var(--mono);font-size:10px;color:var(--dim);width:14px}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;padding:0 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.nav[aria-current="page"] .cnt{background:var(--accent);color:#fff}
.nav .soon{margin-left:auto;font-size:10px;color:var(--dim)}
.rail-foot{margin-top:auto;padding:12px;border-radius:10px;background:var(--panel);font-size:12px;color:var(--muted)}
.rail-foot b{display:block;font-family:var(--mono);font-size:18px;color:var(--fg);font-weight:500}
main{overflow:auto;height:100%;padding:26px 30px 60px;min-width:0}
main>*{max-width:1400px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:28px}
.sub{color:var(--muted);margin:4px 0 0;max-width:75ch}
.example{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 8px;border-radius:6px}
.btn{padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;background:var(--panel2);border:1px solid var(--line);text-align:center;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.cy{color:var(--accent2)}
.btn.bad{color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn.big{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.fill>.btn{flex:1}
.note{font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.chip{padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,var(--panel))}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.cy{color:var(--accent2)} .pill.pk{color:var(--accent)}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

.player{aspect-ratio:9/16;max-width:100%;border-radius:10px;position:relative;overflow:hidden;background:var(--panel2) center/cover;border:1px solid var(--line)}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.65));pointer-events:none}
.player:has(video)::after{display:none}
.p-info,.status{pointer-events:none}
.player video{z-index:1}
.play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:1}
.play::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.p-info{position:absolute;left:8px;right:8px;bottom:6px;z-index:1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
.status{position:absolute;top:8px;left:8px;z-index:1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.65)}
.status.gen{color:var(--warn)} .status.fix{color:var(--accent2)} .status.ok{color:var(--ok)}
.status.r{left:auto;right:8px}

/* products (viral finds) */
.scrollbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.scrolling{display:flex;align-items:center;gap:10px;color:var(--accent2);font-weight:600}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent2);border-top-color:transparent;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vrow{display:grid;grid-template-columns:110px 1fr 220px;gap:18px;align-items:start;margin-bottom:12px}
.vrow .player{width:110px}
.vrow h3{font-size:17px;margin:2px 0 4px}
.why{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:8px;font-size:13px}
.why dt{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.why dd{margin:0}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.num{background:var(--panel2);border-radius:8px;padding:6px 8px}
.num small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num b{font-family:var(--mono);font-weight:500;font-size:14px}
.num.hl b{color:var(--accent)}

/* my products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:12px}
.pcard:hover{border-color:var(--dim)}
.plogo{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:#fff;flex:none}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--panel2)}
.steps span.on{background:var(--accent2)}
.back{color:var(--muted);font-size:13px;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--fg)}
.detail{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.step{margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-h .k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--panel2);color:var(--muted)}
.step-h .k.done{background:var(--ok);color:#000}
.step-h h3{font-size:16px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.asset{display:flex;flex-direction:column;gap:6px}
.art{border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;display:grid;place-items:center}
.art.sq{aspect-ratio:1}
.art.wide{aspect-ratio:820/312}
.art .mono{font-family:var(--display);font-weight:700;color:#fff}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#fff;padding:3px;width:100%;height:100%}
.collage div{background:#f1f1f4;display:grid;place-items:center;color:#9a9ab0;font-size:10px}
.box3d{width:58%;height:58%;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:13px;box-shadow:10px 10px 0 rgba(0,0,0,.25)}
.wide-asset{grid-column:1/-1}
.side{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

/* concepts */
.cstep{margin-bottom:20px}
.cstep h2{font-size:17px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.cstep h2 .k{font-family:var(--mono);font-size:12px;color:var(--dim)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lcard{display:grid;grid-template-columns:62px 1fr;gap:12px;text-align:left;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.lcard[aria-pressed="true"]{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--panel))}
.lcard .player{width:62px;border-radius:7px}
.lcard h4{font-size:14px;margin-bottom:2px}
.lcard p{margin:0;font-size:12px;color:var(--muted)}
.lcard .fits{margin-top:6px;font-size:11px;color:var(--dim)}
.combos{display:flex;flex-direction:column;gap:8px}
.combo{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.combo b{font-family:var(--display)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent2);color:#000;font-weight:600}
.genbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* generations / finals */
.ggroup{margin-bottom:22px}
.ggroup-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ggroup-h .plogo{width:34px;height:34px;border-radius:9px;font-size:14px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.vid{display:flex;flex-direction:column;gap:8px;min-width:0}
.vid .lab{font-size:12px;line-height:1.35}
.vid .lab b{display:block;font-family:var(--display);font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.confirm{font-size:12px;color:var(--bad);text-align:center}

/* library */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.addform{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.addform .full{grid-column:1/-1}

.crit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin-bottom:18px}
.crit input,.crit select{font-family:var(--mono)}
.checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ck{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--ok)}
.demand{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:13px}
.demand .lvl{font-weight:700}
.demand .lvl.High{color:var(--ok)} .demand .lvl.Medium{color:var(--warn)} .demand .lvl.Low{color:var(--bad)}
.demand q{display:block;color:var(--muted);font-size:12px;margin-top:3px}
a.player{display:block;color:inherit}
a.title-link{color:inherit;text-decoration:none}
a.title-link:hover{text-decoration:underline}
.ext{font-size:11px;color:var(--accent2);position:absolute;top:8px;right:8px;z-index:1;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:5px}
.lcard{position:relative}
.lcard .tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lcard .tools .btn{padding:3px 9px;font-size:11px;cursor:pointer}
.lcard .tools input[type=file]{display:none}
.lcard video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:0}
.lcard .player::after{display:none}
.lcard .sel{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:transparent}
.lcard[aria-pressed="true"] .sel{background:var(--accent2);border-color:var(--accent2)}
.rename{display:flex;gap:6px;margin-bottom:4px}
.rename input{padding:4px 8px}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.player video ~ .play{display:none}
body.live .example{display:none}
.modetag{font-weight:600}
body.live .modetag{color:var(--ok)}
#jobs{display:flex;flex-direction:column;gap:6px;margin-top:auto;margin-bottom:10px}
#jobs:empty{display:none}
.jobrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.jobrow b{display:block;font-size:12px}
.jobrow span{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow button{font-size:11px;color:var(--bad);margin-top:4px}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.conn .panel h3{font-size:16px;margin-bottom:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--dim)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
code.cmd{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12px;margin:6px 0;user-select:all;overflow-x:auto}
.form{display:flex;flex-direction:column;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
ol.steps-list{margin:6px 0 0;padding-left:18px;color:var(--muted)}
ol.steps-list li{margin:4px 0}
.modal{position:fixed;inset:41px 0 0 0;background:rgba(5,5,10,.72);display:grid;place-items:center;z-index:30;padding:20px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(720px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ocgrp{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel2)}
.ocgrp summary{cursor:pointer;font-family:var(--display);font-weight:600}
.chip input{accent-color:var(--accent2)}
.upov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(8,8,14,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center;padding:10px;font-size:12px}
.upov span:last-child{color:var(--muted);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.selbox{position:absolute;top:8px;left:8px;z-index:3;background:rgba(0,0,0,.6);border-radius:6px;padding:3px 5px;cursor:pointer}
.selbox input{width:18px;height:18px;accent-color:var(--accent2);cursor:pointer}
.vid.selon .player{outline:2px solid var(--accent2);outline-offset:2px}
.chip.sm{padding:3px 10px;font-size:12px}
.sugg{gap:6px}
.lcard .grip{position:absolute;top:6px;right:8px;color:var(--dim);font-size:16px;cursor:grab;user-select:none;z-index:3}
.lcard[draggable="true"]{cursor:grab}
.lcard.dragging{opacity:.35}
.lcard.dropbefore{box-shadow:-4px 0 0 var(--accent2)}
.lcard.dropafter{box-shadow:4px 0 0 var(--accent2)}
.pastlist{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
.pastitem{border-bottom:1px solid var(--line);padding-bottom:8px}
.pastitem:last-child{border-bottom:0;padding-bottom:0}
.orig{font-size:12px;color:var(--accent2);margin:0 0 4px}
table.bd{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.bd th,table.bd td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.bd th{color:var(--muted);font-weight:600}
.soonbox{max-width:620px}
.soonbox ul{color:var(--muted);padding-left:18px}

.toast{position:fixed;right:20px;bottom:20px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
@media (max-width:1150px){.detail{grid-template-columns:1fr}.side{position:static}.vrow{grid-template-columns:90px 1fr}.vrow .player{width:90px}.vrow .act{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="titlebar"><div class="brand"><i></i>Viral Studio</div><span class="sp"></span><span class="modetag" id="modelabel">Example data</span></header>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="grp">Find</div>
    <button class="nav" data-view="products"><span class="n">1</span>Products<span class="cnt" id="c-products"></span></button>
    <button class="nav" data-view="my"><span class="n">2</span>My products<span class="cnt" id="c-my"></span></button>
    <div class="grp">Create</div>
    <button class="nav" data-view="concepts"><span class="n">3</span>Concepts</button>
    <button class="nav" data-view="generations"><span class="n">4</span>Generations<span class="cnt" id="c-gen"></span></button>
    <button class="nav" data-view="finals"><span class="n">5</span>Finals<span class="cnt" id="c-fin"></span></button>
    <div class="grp">Library &amp; posting</div>
    <button class="nav" data-view="schedule"><span class="n"></span>Schedule<span class="soon">later</span></button>
    <button class="nav" data-view="connection"><span class="n"></span><span class="dot" id="ccdot"></span>Connection</button>
    <div id="jobs"></div>
    <div class="rail-foot">Higgsfield credits today<b id="credits">0</b><button class="btn" id="reset" style="margin-top:10px;width:100%">Reset example data</button></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<datalist id="lenlist"><option value="3s"><option value="5s"><option value="6s"><option value="8s"><option value="10s"><option value="12s"><option value="15s"><option value="20s"><option value="30s"></datalist>

<script>
const IMG={v1:"img/v1.jpg",v2:"img/v2.jpg",v3:"img/v3.jpg",v4:"img/v4.jpg"};
const G=(a,b)=>`linear-gradient(160deg,${a},${b})`;
const uid=()=>Math.random().toString(36).slice(2,9);

function seed(){return{
  credits:216,
  criteria:{maxPosts:20,minFollowers:500,minX:10,demand:"Medium",count:5,minutes:20,lastPostDays:2,minSharePct:5},

let MODE=(()=>{if(!window.studio)return "example";try{if(!localStorage.getItem("vs-live-default")){localStorage.setItem("vs-live-default","1");localStorage.setItem("vs-mode","live")}return localStorage.getItem("vs-mode")||"live"}catch(e){return "live"}})();
const KEY=()=>MODE==="live"?"vs-live":"vs3";
function seedLive(){const s=seed();s.finds=[];s.products=[];s.gens=[];s.credits=0;return s}
function load(){let s=MODE==="live"?seedLive():seed();try{const x=JSON.parse(localStorage.getItem(KEY())||"null");if(x&&x.v===3){s=x.s;s.ui={...seed().ui}}}catch(e){}return s}
let S=load();
const save=()=>{try{localStorage.setItem(KEY(),JSON.stringify({v:3,s:S}))}catch(e){}};

const media=pth=>!pth?"":/^(https?:|file:|blob:|data:|img\/)/.test(pth)?pth:"file:///"+(WS.replace(/\\/g,"/")+"/"+pth).replace(/^\/+/,"");
const vmedia=o=>o.video?`<video src="${esc(media(o.video))}" muted loop playsinline controls preload="metadata"></video>`:"";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg=o=>o.img?`background-image:url('${o.img}')`:o.bg&&o.bg.startsWith("img/")?`background-image:url('${o.bg}')`:`background:${o.bgc||o.bg||"var(--panel2)"}`;
const P=id=>S.products.find(p=>p.id===id);
const initials=n=>(n||"?").replace(/[^A-Za-z ]/g,"").split(/\s+|(?=[A-Z])/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const logo=(p,cls="plogo")=>p.art&&p.art.logo?`<span class="${cls}" style="background:#fff;overflow:hidden;padding:0"><img src="${esc(media(p.art.logo))}" alt="${esc(p.name||"")} logo" style="width:100%;height:100%;object-fit:cover"></span>`:`<span class="${cls}" style="background:${p.name?p.color:"var(--panel2)"}">${p.name?initials(p.name):"?"}</span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
const kitDone=p=>Object.values(p.kit).filter(v=>v==="ok").length;
const pStep=p=>(p.variation?1:0)+(p.name?1:0)+(kitDone(p)===4?1:0);

}

function applyResult(g,type,r){

  if(type==="upscale"){Object.assign(g,{st:"final",video:r.video,up_job:r.job_id,drive:false,stuck:false});return true}
  if(!r.video)return false;
  Object.assign(g,{st:"ready",video:r.video,job_id:r.job_id||g.job_id,prompt:r.prompt||g.prompt,dur:r.duration||g.dur,cr:r.credits||g.cr,stuck:false});
  S.credits+=r.credits||0;return true;
}
async function recoverStuck(){
  if(MODE!=="live"||!window.studio||!window.studio.jobResult)return;
  let running=[];try{running=await window.studio.runningJobs()}catch(e){}
  for(const g of S.gens){
    if(!["generating","fixing","upscaling"].includes(g.st))continue;
    if(g.jobId&&(JOBS[g.jobId]||running.includes(g.jobId)))continue;
    const type=(g.jobId||"").split("-")[0]||"generate";
    let r=null;if(g.jobId){try{r=await window.studio.jobResult(g.jobId)}catch(e){}}
    if(r&&r.file&&!r.file.includes("partial")&&applyResult(g,type,r)){toast("Recovered a finished video");continue}
    if(r&&r.job_id)g.hf_job=r.job_id;
    g.stuck=true;
  }
  render();
}

    case"suggother":{const el=$("#"+b.dataset.for);if(el){el.value="";el.focus()}b.parentNode.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));return}
    case"suggmore":{const pr=P(S.concept.pid),x=[...S.hooks,...S.reveals].find(i=>i.id===S.ui.genFor);if(MODE!=="live"){toast("Options come from Claude in Live mode");return}askSugg(pr,x);break}
    case"autofind":(async()=>{const kind=b.dataset.v,list=kind==="hook"?S.hooks:S.reveals,miss=list.filter(x=>x.clipName&&!x.clip&&!CLIPS[x.id]);toast("Looking in Downloads, Desktop, Videos, Documents…");
      let found={};try{found=await window.studio.findMedia(miss.map(x=>x.clipName))}catch(e){toast("Search failed: "+e.message);return}
      let n=0;for(const x of miss){const src=found[x.clipName];if(!src)continue;try{x.clip=await window.studio.importMedia(src);n++}catch(e){window.studio.log("autofind import "+src+": "+e.message)}}
      const left=miss.length-n;toast(n?`Attached ${n} clip${n===1?"":"s"}${left?` · ${left} not found, use Re-attach clips`:""}`:"No matching files found. Use Re-attach clips and pick them");render()})();return;
    case"relinkclose":S.ui.relinkOpen=false;PENDING_CLIPS=[];toast("Clips attached");break;
    case"ownclip":{S.ui.ownClip=true;const pr=P(S.concept.pid);if(pr&&!pr.sugg)askSugg(pr,null);break}
    case"ownclipclose":S.ui.ownClip=false;break;
    case"ownclipsave":readOwnClip().then(r=>{if(!r)return;S.ui.ownClip=false;toast("Saved to "+(r.kind==="hook"?"Hooks":"Reveals"));render()});return;
    case"ownclipgo":readOwnClip().then(r=>{if(!r)return;S.ui.ownClip=false;for(let i=0;i<r.spec.versions;i++)genOne(r.x,r.kind,r.spec.engine,{});render()});return;
    case"hfget":if(!window.studio){toast("Only works in the desktop app");return}getFromHiggsfield(gen);break;
    case"unstick":if(gen.video){gen.st=(gen.jobId||"").startsWith("upscale")?"ready":"ready";gen.stuck=false}else S.gens=S.gens.filter(x=>x!==gen);break;
    case"closeview":if(e.target.closest("[data-stop]")&&!e.target.closest("button"))return;S.ui.view=null;break;
    case"nonniche":setVar(p,"As is · no new niche");return;
    case"varownsave":{const v=$("#varown").value.trim();if(!v){toast("Describe the variation or niche first");return}setVar(p,v);return}
    case"ownnamesave":{const v=$("#ownname").value.trim();if(!v){toast("Type a name first");return}if(p.name!==v){p.unOpts=null;p.social=p.social||{}}p.name=v;toast("Name saved");break}
    case"setun":{const plat=b.dataset.plat,v=($(plat==="instagram"?"#myig":"#mytt").value||"").trim().replace(/^@/,"");p.social=p.social||{};if(v)p.social[plat]=v;else delete p.social[plat];p.handles=[p.social.instagram&&"IG @"+p.social.instagram,p.social.tiktok&&"TikTok @"+p.social.tiktok].filter(Boolean).join(" · ");toast(v?"Username saved":"Username cleared");break}
    case"handles":checkHandles(p,b.dataset.v?[b.dataset.v]:p.nameOpts);break;
    case"findun":findUsernames(p,[]);break;
    case"checkun":{const v=($("#ownun").value||"").trim().replace(/^@/,"").toLowerCase();if(!v){toast("Type a username first");return}findUsernames(p,[v]);break}
    case"pickun":p.social=p.social||{};p.social[b.dataset.plat]=b.dataset.v;p.handles=[p.social.instagram&&"IG @"+p.social.instagram,p.social.tiktok&&"TikTok @"+p.social.tiktok].filter(Boolean).join(" · ");break;
    case"comp":compSearch(p,+b.dataset.i);break;
    case"pickidea":{const it=(p.ideas||[])[+b.dataset.i];if(it){if(it.type==="niche")p.niche=it.audience||it.title;setVar(p,it.title);return}break}
    case"tab":S.ui.libTab=b.dataset.v;S.ui.addOpen=false;break;
    case"addopen":S.ui.addOpen=true;break;
    case"addclose":S.ui.addOpen=false;break;
    case"libdel":S.hooks=S.hooks.filter(x=>x.id!==id);S.reveals=S.reveals.filter(x=>x.id!==id);S.concept.hooks=S.concept.hooks.filter(x=>x!==id);S.concept.reveals=S.concept.reveals.filter(x=>x!==id);S.ui.delAsk=null;toast("Deleted");break;
  }
  render();
});
$("#main").addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.relinkpick!=null&&t.value){const r=PENDING_CLIPS.filter(q=>!q.ok)[+t.dataset.relinkpick];const x=[...S.hooks,...S.reveals].find(i=>i.id===t.value);if(r&&x){if(/^blob:/.test(r.path))CLIPS[x.id]=r.path;else x.clip=r.path;x.clipName=r.name;r.ok=true;r.hook=x.name}render();return}
  if(t.dataset&&t.dataset.finsel){const id=t.dataset.finsel;S.ui.finSel=S.ui.finSel||[];S.ui.finSel=t.checked?[...S.ui.finSel,id]:S.ui.finSel.filter(x=>x!==id);render();return}
  if(t.dataset&&t.dataset.relink&&t.files&&t.files.length){
    const kind=t.dataset.relink,list=kind==="hook"?S.hooks:S.reveals,files=[...t.files];
    const fk=n=>String(n||"").toLowerCase().replace(/\.[a-z0-9]+$/,"").replace(/[\s_\-()]/g,"");
    const rows=[];const used=new Set();
    for(const f of files){const x=list.find(i=>!used.has(i.id)&&!i.clip&&!CLIPS[i.id]&&i.clipName&&fk(i.clipName)===fk(f.name));if(x)used.add(x.id);rows.push({f,x})}
    toast("Saving clips…");
    PENDING_CLIPS=[];
    for(const r of rows){let fp="";try{fp=await saveFile(r.f)}catch(err){r.err=String(err.message||err)}
      if(r.x&&fp){if(/^blob:/.test(fp))CLIPS[r.x.id]=fp;else r.x.clip=fp;r.ok=true}
      PENDING_CLIPS.push({name:r.f.name,path:fp,hook:r.x?r.x.name:"",ok:!!r.ok,err:r.err||""})}
    S.ui.relinkKind=kind;S.ui.relinkOpen=true;render();return}
  if(t.dataset&&t.dataset.notefiles&&t.files&&t.files.length){const p=P(S.ui.prod);p.noteFiles=p.noteFiles||[];for(const f of [...t.files]){try{p.noteFiles.push({name:f.name,path:await saveFile(f)})}catch(err){toast("Couldn't save "+f.name)}}toast("Files attached");render();return}
  if(t.dataset&&t.dataset.addphotos&&t.files&&t.files.length){const p=P(S.ui.prod);p.photos=p.photos||[];for(const f of [...t.files]){try{p.photos.push(await saveFile(f))}catch(err){toast("Couldn't save "+f.name)}}if(!p.img&&p.photos[0])p.img=media(p.photos[0]);toast("Photos added");render();return}
  if(t.dataset&&t.dataset.kitup&&t.files&&t.files[0]){const p=P(S.ui.prod),k=t.dataset.kitup;try{const fp=await saveFile(t.files[0]);p.art=p.art||{};p.art[k]=fp;p.kit[k]="ok";toast("Uploaded");render()}catch(err){toast("Couldn't save the file")}return}
  if(t.dataset&&t.dataset.up&&t.files&&t.files[0]){const f=t.files[0],x=[...S.hooks,...S.reveals].find(i=>i.id===t.dataset.up);if(!x)return;try{toast("Saving clip…");const fp=await saveFile(f);if(CLIPS[x.id])URL.revokeObjectURL(CLIPS[x.id]);delete CLIPS[x.id];if(/^blob:/.test(fp))CLIPS[x.id]=fp;else x.clip=fp;x.clipName=f.name;toast("Clip uploaded")}catch(err){toast("Couldn't save the clip: "+(err.message||err));window.studio&&window.studio.log&&window.studio.log("upload clip failed: "+(err.message||err))}render();return}
  const num=v=>parseInt(String(v).replace(/[^0-9]/g,""),10);
  if(t.id==="cr-posts"&&num(t.value)>0)S.criteria.maxPosts=num(t.value);
  if(t.id==="cr-fol"&&num(t.value)>=0)S.criteria.minFollowers=num(t.value);
  if(t.id==="cr-x"&&num(t.value)>0){S.criteria.minX=num(t.value);t.value=S.criteria.minX+"×"}
  if(t.id==="cr-dem")S.criteria.demand=t.value;
  if(t.id==="cr-days"&&num(t.value)>=0)S.criteria.lastPostDays=num(t.value);
  if(t.id==="cr-share"&&num(t.value)>=0){S.criteria.minSharePct=num(t.value);t.value=S.criteria.minSharePct+"%"}
  if(t.id==="cr-count"&&num(t.value)>0)S.criteria.count=Math.min(num(t.value),50);
  if(t.id==="cr-min"&&num(t.value)>0)S.criteria.minutes=Math.min(num(t.value),240);
  if(t.id&&t.id.startsWith("cr-"))save();
});
$("#main").addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.ui.genFor||S.ui.view||S.ui.ownClip)){S.ui.genFor=null;S.ui.view=null;S.ui.ownClip=false;render();return}if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("pcard")){e.preventDefault();e.target.click();return}if(e.target.id==="rn-input"&&e.key==="Enter"){e.preventDefault();document.querySelector('[data-a="rnsave"]').click()}});
document.addEventListener("error",e=>{const v=e.target;if(!v||v.tagName!=="VIDEO"||!v.closest(".lcard"))return;const pl=v.parentNode;if(pl.querySelector(".playerr"))return;pl.insertAdjacentHTML("beforeend",'<span class="note playerr" style="position:absolute;inset:auto 4px 6px;text-align:center;z-index:3;font-size:10px;color:var(--bad)">Can\'t play this file</span>')},true);
// Drag hook/reveal cards to reorder them (order is saved).
let DRAG=null;
$("#main").addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".lcard[data-drag]");if(!c)return;if(e.target.closest("input,textarea,select"))return;DRAG={id:c.dataset.drag,kind:c.dataset.dragkind};c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",DRAG.id)}catch(_){}});
$("#main").addEventListener("dragend",()=>{document.querySelectorAll(".lcard.dragging,.lcard.dropbefore,.lcard.dropafter").forEach(c=>c.classList.remove("dragging","dropbefore","dropafter"));DRAG=null});
$("#main").addEventListener("dragover",e=>{if(!DRAG)return;const c=e.target.closest&&e.target.closest(".lcard[data-drag]");if(!c||c.dataset.dragkind!==DRAG.kind||c.dataset.drag===DRAG.id)return;e.preventDefault();const r=c.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;document.querySelectorAll(".lcard.dropbefore,.lcard.dropafter").forEach(x=>x.classList.remove("dropbefore","dropafter"));c.classList.add(after?"dropafter":"dropbefore")});
$("#main").addEventListener("drop",e=>{if(!DRAG)return;const c=e.target.closest&&e.target.closest(".lcard[data-drag]");if(!c||c.dataset.dragkind!==DRAG.kind)return;e.preventDefault();
  const list=DRAG.kind==="hook"?S.hooks:S.reveals,from=list.findIndex(x=>x.id===DRAG.id);if(from<0)return;const [item]=list.splice(from,1);
  let to=list.findIndex(x=>x.id===c.dataset.drag);const r=c.getBoundingClientRect();if(e.clientX>r.left+r.width/2)to++;list.splice(to<0?list.length:to,0,item);DRAG=null;render()});
boot();
</script>
