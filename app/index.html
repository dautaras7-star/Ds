<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: file:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'">
<title>Viral Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: desktop shell = title bar + left rail of pipeline steps + scrolling content. 9:16 tiles are the main unit. Single dark look. */
:root{
  --bg:#0b0b10; --panel:#14141c; --panel2:#1c1c27; --line:#2a2a38;
  --fg:#f2f2f7; --muted:#9a9ab0; --dim:#6b6b80;
  --accent:#ff2d6f; --accent2:#25e2f0;
  --ok:#3ddc84; --warn:#ffb020; --bad:#ff5a5a;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}

.titlebar{height:40px;display:flex;align-items:center;gap:10px;padding:0 150px 0 16px;border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;font-size:12px;color:var(--muted)}
.brand{font-family:var(--display);font-weight:700;font-size:14px;color:var(--fg);display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.sp{flex:1}
.app{display:grid;grid-template-columns:230px 1fr;height:calc(100% - 41px)}
.rail{height:100%;overflow:auto;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--fg)}
.nav[aria-current="page"]{background:var(--panel2);color:var(--fg)}
.nav .n{font-family:var(--mono);font-size:10px;color:var(--dim);width:14px}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;padding:0 7px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.nav[aria-current="page"] .cnt{background:var(--accent);color:#fff}
.nav .soon{margin-left:auto;font-size:10px;color:var(--dim)}
.rail-foot{margin-top:auto;padding:12px;border-radius:10px;background:var(--panel);font-size:12px;color:var(--muted)}
.rail-foot b{display:block;font-family:var(--mono);font-size:18px;color:var(--fg);font-weight:500}
main{overflow:auto;height:100%;padding:26px 30px 60px;min-width:0}
main>*{max-width:1400px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:28px}
.sub{color:var(--muted);margin:4px 0 0;max-width:75ch}
.example{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 8px;border-radius:6px}
.btn{padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;background:var(--panel2);border:1px solid var(--line);text-align:center;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.cy{color:var(--accent2)}
.btn.bad{color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn.big{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.fill>.btn{flex:1}
.note{font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.chip{padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,var(--panel))}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.cy{color:var(--accent2)} .pill.pk{color:var(--accent)}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

.player{aspect-ratio:9/16;max-width:100%;border-radius:10px;position:relative;overflow:hidden;background:var(--panel2) center/cover;border:1px solid var(--line)}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.65))}
.play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:1}
.play::before{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.p-info{position:absolute;left:8px;right:8px;bottom:6px;z-index:1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
.status{position:absolute;top:8px;left:8px;z-index:1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.65)}
.status.gen{color:var(--warn)} .status.fix{color:var(--accent2)} .status.ok{color:var(--ok)}
.status.r{left:auto;right:8px}

/* products (viral finds) */
.scrollbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.scrolling{display:flex;align-items:center;gap:10px;color:var(--accent2);font-weight:600}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent2);border-top-color:transparent;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vrow{display:grid;grid-template-columns:110px 1fr 220px;gap:18px;align-items:start;margin-bottom:12px}
.vrow .player{width:110px}
.vrow h3{font-size:17px;margin:2px 0 4px}
.why{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:8px;font-size:13px}
.why dt{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.why dd{margin:0}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.num{background:var(--panel2);border-radius:8px;padding:6px 8px}
.num small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num b{font-family:var(--mono);font-weight:500;font-size:14px}
.num.hl b{color:var(--accent)}

/* my products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:12px}
.pcard:hover{border-color:var(--dim)}
.plogo{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:#fff;flex:none}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--panel2)}
.steps span.on{background:var(--accent2)}
.back{color:var(--muted);font-size:13px;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--fg)}
.detail{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.step{margin-bottom:14px}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-h .k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--panel2);color:var(--muted)}
.step-h .k.done{background:var(--ok);color:#000}
.step-h h3{font-size:16px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.asset{display:flex;flex-direction:column;gap:6px}
.art{border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;display:grid;place-items:center}
.art.sq{aspect-ratio:1}
.art.wide{aspect-ratio:820/312}
.art .mono{font-family:var(--display);font-weight:700;color:#fff}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#fff;padding:3px;width:100%;height:100%}
.collage div{background:#f1f1f4;display:grid;place-items:center;color:#9a9ab0;font-size:10px}
.box3d{width:58%;height:58%;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:13px;box-shadow:10px 10px 0 rgba(0,0,0,.25)}
.wide-asset{grid-column:1/-1}
.side{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

/* concepts */
.cstep{margin-bottom:20px}
.cstep h2{font-size:17px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.cstep h2 .k{font-family:var(--mono);font-size:12px;color:var(--dim)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lcard{display:grid;grid-template-columns:62px 1fr;gap:12px;text-align:left;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.lcard[aria-pressed="true"]{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--panel))}
.lcard .player{width:62px;border-radius:7px}
.lcard h4{font-size:14px;margin-bottom:2px}
.lcard p{margin:0;font-size:12px;color:var(--muted)}
.lcard .fits{margin-top:6px;font-size:11px;color:var(--dim)}
.combos{display:flex;flex-direction:column;gap:8px}
.combo{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.combo b{font-family:var(--display)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent2);color:#000;font-weight:600}
.genbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* generations / finals */
.ggroup{margin-bottom:22px}
.ggroup-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ggroup-h .plogo{width:34px;height:34px;border-radius:9px;font-size:14px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.vid{display:flex;flex-direction:column;gap:8px;min-width:0}
.vid .lab{font-size:12px;line-height:1.35}
.vid .lab b{display:block;font-family:var(--display);font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.confirm{font-size:12px;color:var(--bad);text-align:center}

/* library */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.addform{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.addform .full{grid-column:1/-1}

.soonbox{max-width:620px}
.soonbox ul{color:var(--muted);padding-left:18px}

.toast{position:fixed;right:20px;bottom:20px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
@media (max-width:1150px){.detail{grid-template-columns:1fr}.side{position:static}.vrow{grid-template-columns:90px 1fr}.vrow .player{width:90px}.vrow .act{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="titlebar"><div class="brand"><i></i>Viral Studio</div><span class="sp"></span><span>Prototype · example data</span></header>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="grp">Find</div>
    <button class="nav" data-view="products"><span class="n">1</span>Products<span class="cnt" id="c-products"></span></button>
    <button class="nav" data-view="my"><span class="n">2</span>My products<span class="cnt" id="c-my"></span></button>
    <div class="grp">Create</div>
    <button class="nav" data-view="concepts"><span class="n">3</span>Concepts</button>
    <button class="nav" data-view="generations"><span class="n">4</span>Generations<span class="cnt" id="c-gen"></span></button>
    <button class="nav" data-view="finals"><span class="n">5</span>Finals<span class="cnt" id="c-fin"></span></button>
    <div class="grp">Library &amp; posting</div>
    <button class="nav" data-view="library"><span class="n"></span>Hooks &amp; reveals</button>
    <button class="nav" data-view="schedule"><span class="n"></span>Schedule<span class="soon">later</span></button>
    <div class="rail-foot">Higgsfield credits today<b id="credits">0</b><button class="btn" id="reset" style="margin-top:10px;width:100%">Reset example data</button></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const IMG={v1:"img/v1.jpg",v2:"img/v2.jpg",v3:"img/v3.jpg",v4:"img/v4.jpg"};
const G=(a,b)=>`linear-gradient(160deg,${a},${b})`;
const uid=()=>Math.random().toString(36).slice(2,9);

function seed(){return{
  credits:216,
  finds:[
    {id:"f1",img:IMG.v2,handle:"@cabin.family.fun",followers:"18K",views:"8.4M",x:"466×",likes:"612K",comments:"9.1K",posted:"2 days ago",product:"Projector hunting game",supplier:"AliExpress · $21.40",hook:"Dad snatches the kids' screens, then reveals the box",reveal:"Unbox → projector lights up the wall → family plays",link:"instagram.com/reel/…"},
    {id:"f2",img:"",bg:G("#3a1550","#0d2a4a"),handle:"@glowroomco",followers:"42K",views:"5.2M",x:"124×",likes:"480K",comments:"6.3K",posted:"1 day ago",product:"Galaxy star projector",supplier:"AliExpress · $9.80",hook:"Girlfriend turns off the light",reveal:"Room turns into a galaxy, slow pan",link:"instagram.com/reel/…"},
    {id:"f3",img:"",bg:G("#4a2a10","#1a1a1a"),handle:"@relaxlabs",followers:"9K",views:"3.9M",x:"433×",likes:"201K",comments:"4.8K",posted:"3 days ago",product:"Mini massage gun",supplier:"AliExpress · $12.10",hook:"Grandpa tries it for the first time",reveal:"Close-up of muscle ripple + his face",link:"instagram.com/reel/…"},
    {id:"f4",img:"",bg:G("#12402a","#0b0b10"),handle:"@garagehacks",followers:"61K",views:"2.7M",x:"44×",likes:"150K",comments:"2.2K",posted:"today",product:"Magnetic phone car mount",supplier:"AliExpress · $3.20",hook:"\"Stop buying cheap mounts\"",reveal:"Pothole test, phone doesn't move",link:"instagram.com/reel/…"},
    {id:"f5",img:"",bg:G("#40210f","#2a0f2a"),handle:"@cozycorner.home",followers:"25K",views:"1.9M",x:"76×",likes:"98K",comments:"1.4K",posted:"today",product:"Heated desk pad",supplier:"AliExpress · $14.90",hook:"POV: your office is freezing",reveal:"Hands on pad, steam of coffee, smile",link:"instagram.com/reel/…"}
  ],
  products:[
    {id:"p1",from:"Projector hunting game",img:IMG.v2,variation:"Same product, rebrand",niche:"Toys · Christmas gifts",nameOpts:["WildBeam","HuntGlow","TrailShot Arcade","Buckshot Beam"],name:"WildBeam",color:"#d9480f",kit:{logo:"ok",cover:"ok",collage:"ok",box:"ok"},supplier:"AliExpress · $21.40",handles:"@wildbeam.game"},
    {id:"p2",from:"FPV RC car + VR headset",img:IMG.v1,variation:"Variation: racing drift car",niche:"Gadgets · Gifts for dads",nameOpts:["DriftView","PilotSeat","CouchRacer","FirstLap"],name:"DriftView",color:"#1f9e5a",kit:{logo:"ok",cover:"pending",collage:"pending",box:"todo"},supplier:"AliExpress · $54.00",handles:"@driftview"},
    {id:"p3",from:"Galaxy star projector",img:"",bg:G("#3a1550","#0d2a4a"),variation:"",niche:"",nameOpts:[],name:"",color:"#6c3fd1",kit:{logo:"todo",cover:"todo",collage:"todo",box:"todo"},supplier:"AliExpress · $9.80",handles:""}
  ],
  hooks:[
    {id:"h1",name:"3-2-1 countdown",desc:"On-screen countdown energy: \"3, 2, 1…\" then the product does something surprising.",fits:"Gadgets, toys, anything with a wow moment",bg:G("#2b1d4a","#0b0b10")},
    {id:"h2",name:"Pass out in the store",desc:"Someone sees the product on a shelf and dramatically faints / falls over.",fits:"Impulse buys, novelty products",bg:G("#3a2a10","#0b0b10")},
    {id:"h3",name:"Concept vs product",desc:"\"What they see…\" (the idea) vs the real POV of the product in use.",fits:"Gadgets with a POV or a hidden experience",img:IMG.v1},
    {id:"h4",name:"Screens taken away",desc:"Parent grabs the kids' tablets, kids are annoyed, then the box appears.",fits:"Family gifts, toys",img:IMG.v2},
    {id:"h5",name:"The perfect gift doesn't exi—",desc:"Text-style hook, cut off mid-sentence by the reveal.",fits:"Gifts, Q4",bg:G("#40102a","#0b0b10")}
  ],
  reveals:[
    {id:"r1",name:"Unbox → instant use",desc:"Tearing the box open, product out, used within 3 seconds.",fits:"Anything with packaging",img:IMG.v3},
    {id:"r2",name:"In-product POV",desc:"Camera sees what the product sees (car, drone, toy).",fits:"RC, cameras, toys",img:IMG.v4},
    {id:"r3",name:"Lights-off transformation",desc:"Room goes dark, product transforms the space.",fits:"Lights, projectors",bg:G("#1a1550","#0b0b10")},
    {id:"r4",name:"Reaction close-up",desc:"Tight shot on a face: shock, laugh, tears.",fits:"Gifts, surprises",bg:G("#3a1d12","#0b0b10")}
  ],
  gens:[
    {id:"g1",pid:"p1",hook:"Screens taken away",reveal:"Unbox → instant use",engine:"Seedance",dur:"0:15",cr:72,bg:IMG.v3,st:"ready"},
    {id:"g2",pid:"p1",hook:"Concept vs product",reveal:"Reaction close-up",engine:"Genjutsu",dur:"0:15",cr:72,bg:IMG.v2,st:"fixing",fix:"Box logo is blurry in shot 2"},
    {id:"g3",pid:"p2",hook:"Concept vs product",reveal:"In-product POV",engine:"Seedance",dur:"0:15",cr:72,bg:IMG.v4,st:"ready"},
    {id:"g4",pid:"p2",hook:"3-2-1 countdown",reveal:"In-product POV",engine:"Seedance",dur:"0:12",cr:58,bg:"",bgc:G("#1d1d2b","#121218"),st:"generating"},
    {id:"g5",pid:"p1",hook:"Screens taken away",reveal:"Reaction close-up",engine:"Seedance",dur:"0:15",cr:72,bg:IMG.v3,st:"final",drive:false},
    {id:"g6",pid:"p2",hook:"Concept vs product",reveal:"In-product POV",engine:"Seedance",dur:"0:15",cr:72,bg:IMG.v1,st:"final",drive:true}
  ],
  concept:{pid:"p1",hooks:[],reveals:[],engines:{}},
  ui:{fixOpen:null,dropAsk:null,libTab:"hooks",prod:null,scrolling:false,addOpen:false}
}}
let S=seed();
try{const s=JSON.parse(localStorage.getItem("vs2")||"null");if(s&&s.v===2){S=s.s;S.ui={...seed().ui}}}catch(e){}
const save=()=>{try{localStorage.setItem("vs2",JSON.stringify({v:2,s:S}))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg=o=>o.img?`background-image:url('${o.img}')`:o.bg&&o.bg.startsWith("img/")?`background-image:url('${o.bg}')`:`background:${o.bgc||o.bg||"var(--panel2)"}`;
const P=id=>S.products.find(p=>p.id===id);
const initials=n=>(n||"?").replace(/[^A-Za-z ]/g,"").split(/\s+|(?=[A-Z])/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const logo=(p,cls="plogo")=>`<span class="${cls}" style="background:${p.name?p.color:"var(--panel2)"}">${p.name?initials(p.name):"?"}</span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
const kitDone=p=>Object.values(p.kit).filter(v=>v==="ok").length;
const pStep=p=>(p.variation?1:0)+(p.name?1:0)+(kitDone(p)===4?1:0);

function counts(){
  $("#c-products").textContent=S.finds.length;
  $("#c-my").textContent=S.products.length;

    case"eng":S.concept.engines[b.dataset.k]=b.dataset.v;break;
    case"rmcombo":{const c=S.concept;if(c.hooks.length>1&&c.reveals.length>1){toast("Unselect a hook or reveal to drop this pair")}else if(c.hooks.length===1){c.reveals=c.reveals.filter(x=>x!==b.dataset.r)}else{c.hooks=c.hooks.filter(x=>x!==b.dataset.h)}break}
    case"generate":{const c=S.concept;const hk=i=>S.hooks.find(x=>x.id===i).name,rv=i=>S.reveals.find(x=>x.id===i).name;const pr=P(c.pid);const made=[];c.hooks.forEach(h=>c.reveals.forEach(r=>{const g={id:uid(),pid:c.pid,hook:hk(h),reveal:rv(r),engine:c.engines[h+"|"+r]||"Seedance",dur:"0:15",cr:72,bg:"",bgc:G("#1d1d2b","#121218"),st:"generating"};S.gens.unshift(g);made.push(g);S.credits+=72}));S.concept={pid:c.pid,hooks:[],reveals:[],engines:{}};toast(`Generating ${made.length} video${made.length>1?"s":""}`);later(4000,()=>made.forEach(g=>{g.st="ready";g.bg=pr.img||IMG.v4}));location.hash="generations";break}
    case"fix":S.ui.fixOpen=id;S.ui.dropAsk=null;break;
    case"fixcancel":S.ui.fixOpen=null;break;
    case"fixsend":gen.fix=$("#fx").value.trim();gen.st="fixing";S.ui.fixOpen=null;S.credits+=gen.cr;toast("Regenerating with your fix");later(3500,()=>{gen.st="ready"});break;
    case"drop":S.ui.dropAsk=id;S.ui.fixOpen=null;break;
    case"dropno":S.ui.dropAsk=null;break;
    case"dropyes":S.gens=S.gens.filter(g=>g.id!==id);S.ui.dropAsk=null;toast("Dropped");break;
    case"approve":gen.st="upscaling";toast("Upscaling with Topaz · 1080p");later(2500,()=>{gen.st="final";gen.drive=false});break;
    case"unfinal":gen.st="ready";break;
    case"drive":gen.drive=true;toast("Sent to Google Drive");break;
    case"driveall":S.gens.filter(g=>g.st==="final").forEach(g=>g.drive=true);toast("All sent to Google Drive");break;
    case"tab":S.ui.libTab=b.dataset.v;S.ui.addOpen=false;break;
    case"addopen":S.ui.addOpen=true;break;
    case"addclose":S.ui.addOpen=false;break;
    case"libdel":S.hooks=S.hooks.filter(x=>x.id!==id);S.reveals=S.reveals.filter(x=>x.id!==id);break;
  }
  render();
});
render();
</script>
